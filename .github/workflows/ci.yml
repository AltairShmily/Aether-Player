name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ──────────────────────────────────────────────
  #  Go Backend — Build & Test
  # ──────────────────────────────────────────────
  go-build:
    name: Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api/

  # ──────────────────────────────────────────────
  #  Flutter App — Analyze & Test
  # ──────────────────────────────────────────────
  flutter-check:
    name: Flutter Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - name: Install deps
        working-directory: app
        run: flutter pub get

      - name: Generate i18n
        working-directory: app
        run: dart run slang

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Test
        working-directory: app
        run: flutter test

  # ──────────────────────────────────────────────
  #  CMake + Ninja 构建测试
  # ──────────────────────────────────────────────
  cmake-build:
    name: CMake + Ninja
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - name: CMake Configure
        run: cmake -B build -G Ninja

      - name: CMake Build
        run: cmake --build build

      - name: Verify bundle
        run: |
          ls -lh build/output/aether-server
          ls -lh app/build/linux/x64/release/bundle/aether
          ls -lh app/build/linux/x64/release/bundle/aether-server
          echo "✅ Go server bundled into Flutter app"

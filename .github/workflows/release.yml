name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  #  构建 + 发布 GitHub Release
  # ──────────────────────────────────────────────
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.x"
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv libsecret-1-dev

      - name: CMake Configure
        run: cmake -B build -G Ninja

      - name: CMake Build
        run: cmake --build build

      - name: Verify bundle
        run: |
          ls -lh build/output/aether-server
          ls -lh app/build/linux/x64/release/bundle/aether
          ls -lh app/build/linux/x64/release/bundle/aether-server

      # ── 打包产物 ──
      - name: Package artifacts
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Go 后端单独包
          tar -czf aether-server-${VERSION}-linux-amd64.tar.gz -C build/output aether-server

          # 完整应用包 (含内嵌 Go 后端)
          tar -czf aether-${VERSION}-linux-amd64.tar.gz -C app/build/linux/x64/release bundle

      # ── 创建 Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Aether Player ${{ env.VERSION }}"
          body: |
            ## Aether Player ${{ env.VERSION }}

            ### 📦 下载

            | 文件 | 说明 |
            |:-----|:-----|
            | `aether-${{ env.VERSION }}-linux-amd64.tar.gz` | 完整应用 (含 Go 后端) |
            | `aether-server-${{ env.VERSION }}-linux-amd64.tar.gz` | 仅 Go 后端 |

            ### 🚀 使用

            ```bash
            # 解压完整应用
            tar -xzf aether-${{ env.VERSION }}-linux-amd64.tar.gz
            cd bundle
            ./aether  # 启动应用 (自动启动内嵌 Go 后端)
            ```

            ### 📝 更新日志

            *(自动从 commits 生成)*
          files: |
            aether-${{ env.VERSION }}-linux-amd64.tar.gz
            aether-server-${{ env.VERSION }}-linux-amd64.tar.gz
          draft: false
          prerelease: ${{ contains(env.VERSION, 'beta') || contains(env.VERSION, 'alpha') || contains(env.VERSION, 'rc') }}

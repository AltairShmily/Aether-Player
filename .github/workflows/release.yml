name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.32.x'
  GO_VERSION: '1.24'

jobs:
  # ══════════════════════════════════════════════════
  #  Linux — CMake + Ninja 构建 + 打包
  # ══════════════════════════════════════════════════
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - name: CMake Configure (with packaging)
        run: cmake -B build -G Ninja -DPACKAGE_DEB=ON

      - name: CMake Build + Package
        run: cmake --build build --target package

      - name: Create AppImage
        run: |
          # AppImage staging
          cmake --build build --target package-appimage 2>/dev/null || true

          mkdir -p appimage
          cp -r app/build/linux/x64/release/bundle/* appimage/
          cp packaging/linux/aether.desktop appimage/
          cp packaging/linux/AppRun appimage/
          chmod +x appimage/AppRun appimage/aether-server

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage appimage/ \
            build/Aether-Player-linux-x86_64.AppImage 2>/dev/null || \
            tar czf build/Aether-Player-linux-x86_64.tar.gz -C appimage .

      - name: Rename .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv build/output/deb/aether_*_amd64.deb \
            build/Aether-Player-${VERSION}-amd64.deb 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/Aether-Player-*.AppImage
            build/Aether-Player-*.tar.gz
            build/Aether-Player-*.deb

  # ══════════════════════════════════════════════════
  #  Windows
  # ══════════════════════════════════════════════════
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Install Ninja
        run: choco install ninja -y

      - name: CMake Configure
        run: cmake -B build -G Ninja

      - name: CMake Build
        run: cmake --build build

      - name: Package ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $src = "app\build\windows\x64\runner\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "build\Aether-Player-${version}-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: build/Aether-Player-*.zip

  # ══════════════════════════════════════════════════
  #  Android
  # ══════════════════════════════════════════════════
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Init & Build
        working-directory: app
        run: |
          flutter create --platforms=android .
          flutter pub get
          dart run slang
          flutter build apk --release
          flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  # ══════════════════════════════════════════════════
  #  Publish GitHub Release
  # ══════════════════════════════════════════════════
  release:
    name: Publish
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: "Aether Player ${{ github.ref_name }}"
          body: |
            ## Aether Player ${{ github.ref_name }}

            ### 📦 Downloads

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Linux | `.AppImage` | 免安装，chmod +x 即可运行 |
            | Linux | `.deb` | Debian/Ubuntu 安装包 |
            | Windows | `.zip` | 解压即用 |
            | Android | `.apk` | 直接安装 |

            > 💡 所有平台均已内置 Go 后端服务，无需额外配置。

            ### 🚀 快速开始

            **Linux AppImage:**
            ```bash
            chmod +x Aether-Player-*.AppImage
            ./Aether-Player-*.AppImage
            ```

            **Linux .deb:**
            ```bash
            sudo dpkg -i Aether-Player-*.deb
            ```

            **Windows:**
            解压 zip，运行 `aether.exe`。

            **Android:**
            安装 APK，后端服务内置运行。
          files: artifacts/**/*
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

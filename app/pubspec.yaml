name: aether
description: Aether - Emby Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.0.0
  flutter_riverpod: ^2.0.0
  shared_preferences: ^2.0.0
  google_fonts: ^6.0.0
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  flutter_secure_storage: ^10.0.0
  dynamic_color: ^1.7.0
  intl: any
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_video: ^1.0.9
  # 注意：Android/iOS/macOS 的 media_kit_libs_* 尚未加入。
  # 曾尝试补上 media_kit_libs_{android,ios,macos}_video，CI 的 Build Android
  # 作业随即在 flutter build apk 阶段失败（此前为绿），本机无 Android SDK
  # 且 CI 日志需认证，无法定位具体的 gradle/NDK 冲突，故先回退。
  # 详见 docs/reports/BUG_REPORT.md 的 BUG-018。
  wakelock_plus: ^1.4.0
  ffi: ^2.1.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  slang_build_runner: ^4.14.0

flutter:
  uses-material-design: true
